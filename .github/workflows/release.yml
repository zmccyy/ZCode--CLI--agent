name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production dependencies
        working-directory: ZCode
        run: npm ci --omit=dev

      - name: Build portable ZIP
        shell: pwsh
        run: .\packaging\windows\build-portable.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zcode-*-win-x64-portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
